[project]
name = "kktc-oto"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2",
    "httpx",
    "selectolax>=0.3,<1",  # 1.0 eski HTMLParser (Modest) arka ucunu kaldırdı: import patlar
    "psycopg[binary]>=3",
    "python-telegram-bot>=21",
    "apify-client",
    "scrapling[fetchers]>=0.4",  # tarayıcı parmak izli HTTP (curl_cffi); tarayıcı kurulumu gerekmez
    "tzdata",  # KKTC saat dilimi (Asia/Famagusta, yaz/kış saati) sistemde saat dilimi verisi olmasa da bulunsun (domain/kktc_time.py)
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]
browser = ["scrapling[fetchers]"]

[tool.setuptools]
packages = []
