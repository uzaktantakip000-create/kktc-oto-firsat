name: Tick (toplama + değerlendirme)
on:
  workflow_dispatch:        # dış tetikleyici (cron-job.org) her 15 dakikada çağırır
  schedule:
    - cron: "17 */2 * * *"  # yedek: dış tetikleyici durursa 2 saatte bir
permissions:
  contents: read
concurrency:
  group: tick
  cancel-in-progress: false  # çalışan tur bitsin, bekleyen en fazla bir tur kuyrukta kalır
jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 20  # tur kendi 13 dk bütçesini tutar (entrypoints/tick.py); sınır yalnızca güvenlik ağı
    env:
      PYTHONUNBUFFERED: "1"  # iptal edilen turda log kaybolmasın
    steps:
      - uses: actions/checkout@v4
        with:
          ref: live   # yalnızca testi geçmiş sürüm (bkz. ci.yml)
      - run: git log -1 --format='canlı sürüm %h %s'
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install .
      - run: python -m entrypoints.tick
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ secrets.OPENROUTER_MODEL }}
