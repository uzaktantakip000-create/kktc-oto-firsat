name: Toplama (kktcarabam, tarayıcılı)
on:
  schedule:
    - cron: "37 */2 * * *"   # 2 saatte bir (sahip kararı 03.10.2026: ilk sayfa 6 ilanla doluyor, 6 saatte araya ilan kaçıyordu; depo herkese açık, dakika sınırsız)
  workflow_dispatch:
concurrency: collect-browser
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: live   # yalnızca testi geçmiş sürüm (bkz. ci.yml)
      - run: git log -1 --format='canlı sürüm %h %s'
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install ".[browser]"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-v1
      - run: scrapling install
      - run: python -m entrypoints.cron_collect kktcarabam
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - if: always()   # kktcarabam ilanları 6 saat beklemeden değerlendirilsin (ortak kilit çift bildirimi önler)
        run: python -m entrypoints.cron_evaluate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ secrets.OPENROUTER_MODEL }}
